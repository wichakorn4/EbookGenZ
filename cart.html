<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าสินค้า - EbookGenZ 🛒</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gradient-to-tr from-cyan-50 via-sky-50 to-blue-50 text-slate-800 min-h-screen">

    <!-- Navigation Bar -->
    <header class="bg-white/80 backdrop-blur-md border-b border-sky-100 sticky top-0 z-50 shadow-sm">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black tracking-wider bg-gradient-to-r from-sky-400 via-blue-500 to-indigo-600 bg-clip-text text-transparent">⚡ EbookGenZ</a>
            <div class="flex items-center space-x-5 text-sm font-semibold">
                <a href="index.html" class="text-slate-600 hover:text-sky-600 transition">หน้าร้านค้า</a>
                <a href="downloads.html" class="text-slate-600 hover:text-sky-600 transition">ดาวน์โหลดของฉัน</a>
                <a href="cart.html" class="relative bg-gradient-to-r from-sky-400 to-blue-500 text-white px-4 py-2 rounded-2xl shadow-md shadow-sky-500/20 flex items-center space-x-2">
                    <span>🛒 ตะกร้า</span>
                    <span id="cart-count" class="bg-yellow-300 text-slate-900 text-xs w-5 h-5 rounded-full flex items-center justify-center font-black">0</span>
                </a>
                <div id="nav-auth-section" class="border-l border-slate-200 pl-4"></div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-6 py-10 max-w-4xl">
        <h1 class="text-3xl font-black text-slate-900 mb-6 tracking-tight">🛒 ตะกร้าสินค้าของคุณ</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div class="md:col-span-2 space-y-4" id="cart-items-list"></div>

            <div class="bg-white/90 backdrop-blur border border-sky-100 p-6 rounded-3xl h-fit shadow-xl shadow-sky-500/5">
                <h2 class="text-lg font-black text-slate-900 mb-4">สรุปคำสั่งซื้อ</h2>
                <div class="flex justify-between mb-2 text-slate-500 text-sm font-medium">
                    <span>ยอดรวมสินค้า</span>
                    <span id="subtotal" class="font-bold text-slate-700">฿0</span>
                </div>
                <hr class="my-4 border-slate-100">
                <div class="flex justify-between mb-6 text-base font-black text-slate-900">
                    <span>ยอดชำระสุทธิ</span>
                    <span id="grand-total" class="text-sky-600 text-xl font-black">฿0</span>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-700 mb-1">วิธีชำระเงิน (จำลอง)</label>
                    <select id="payment-method" class="w-full px-4 py-3 bg-slate-50 border border-sky-200 rounded-2xl text-sm font-medium text-slate-800 focus:outline-none focus:border-sky-400">
                        <option value="PromptPay">PromptPay QR Code</option>
                        <option value="Bank Transfer">โอนผ่านธนาคาร</option>
                    </select>

                    <!-- 📱 กล่อง QR Code จำลอง -->
    <div id="qr-code-section" class="hidden my-4 p-4 bg-sky-50 border border-sky-100 rounded-2xl text-center">
        <p class="text-xs font-bold text-sky-900 mb-2">สแกน QR Code เพื่อชำระเงิน</p>
        <div class="bg-white p-3 inline-block rounded-xl shadow-sm border border-slate-100">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=EbookGenZ-Payment-Simulation" alt="PromptPay QR" class="w-32 h-32 mx-auto">
        </div>
        <p class="text-[11px] text-slate-500 mt-2">พร้อมเพย์: 081-234-5678 (EbookGenZ)</p>
    </div>

    <!-- 🏦 กล่องข้อมูลบัญชีธนาคารจำลอง (ซ่อนไว้ก่อน จะแสดงเฉพาะตอนเลือก Bank Transfer) -->
<div id="bank-section" class="hidden my-4 p-4 bg-indigo-50 border border-indigo-100 rounded-2xl text-left">
    <p class="text-xs font-bold text-indigo-900 mb-2 text-center">โอนเงินผ่านบัญชีธนาคาร</p>
    <div class="space-y-1.5 text-xs text-slate-700 bg-white p-3 rounded-xl border border-indigo-100 shadow-sm">
        <div class="flex justify-between">
            <span class="text-slate-500">ธนาคาร:</span>
            <span class="font-bold text-slate-900">กสิกรไทย (KBANK)</span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-500">เลขที่บัญชี:</span>
            <span class="font-bold text-indigo-600 select-all">123-4-56789-0</span>
        </div>
        <div class="flex justify-between">
            <span class="text-slate-500">ชื่อบัญชี:</span>
            <span class="font-bold text-slate-900">บจก. อีบุ๊ค เจนซ์</span>
        </div>
    </div>
</div>

                </div>

                <div class="mb-6">
                    <label class="block text-xs font-bold text-slate-700 mb-1">แนบสลิปชำระเงิน</label>
                    <input type="file" class="w-full text-xs text-slate-500 file:mr-3 file:py-2.5 file:px-4 file:rounded-2xl file:border-0 file:text-xs file:font-black file:bg-sky-100 file:text-sky-700 hover:file:bg-sky-200 transition">
                </div>

                <button onclick="checkout()" class="w-full bg-gradient-to-r from-sky-400 to-blue-500 text-white py-3.5 rounded-2xl font-black text-sm shadow-lg shadow-sky-500/25 hover:opacity-90 transition">ยืนยันการสั่งซื้อ ✨</button>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        let cart = getUserCart();

        function renderCart() {
            const listContainer = document.getElementById('cart-items-list');
            listContainer.innerHTML = '';

            if(cart.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-16 bg-white/60 backdrop-blur border border-sky-100 rounded-3xl shadow-sm">
                        <p class="text-slate-500 mb-4 font-medium">ยังไม่มีสินค้าในตะกร้าของคุณเลย</p>
                        <a href="index.html" class="bg-gradient-to-r from-sky-400 to-blue-500 text-white px-6 py-3 rounded-2xl text-xs font-black shadow-lg shadow-sky-500/20 inline-block transition">ไปเลือกซื้อ E-Book กันเลย 🚀</a>
                    </div>
                `;
                document.getElementById('subtotal').innerText = '฿0';
                document.getElementById('grand-total').innerText = '฿0';
                document.getElementById('cart-count').innerText = '0';
                return;
            }

            let subtotal = 0;
            cart.forEach((item, index) => {
                subtotal += item.price * item.quantity;
                listContainer.innerHTML += `
                    <div class="bg-white/90 backdrop-blur border border-sky-100 p-4 rounded-3xl flex items-center justify-between shadow-sm">
                        <div class="flex items-center space-x-4">
                            <img src="${item.cover}" class="w-14 h-18 object-cover rounded-2xl border border-sky-100 shadow-sm">
                            <div>
                                <h3 class="font-black text-slate-900 text-sm">${item.title}</h3>
                                <p class="text-xs text-sky-600 font-bold mt-0.5">฿${item.price}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="updateQty(${index}, -1)" class="w-8 h-8 bg-slate-100 text-slate-700 rounded-xl font-black hover:bg-slate-200 transition">-</button>
                            <span class="text-sm font-black">${item.quantity}</span>
                            <button onclick="updateQty(${index}, 1)" class="w-8 h-8 bg-slate-100 text-slate-700 rounded-xl font-black hover:bg-slate-200 transition">+</button>
                            <button onclick="removeItem(${index})" class="text-rose-500 hover:text-rose-700 text-xs font-bold ml-2">ลบ</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('subtotal').innerText = `฿${subtotal}`;
            document.getElementById('grand-total').innerText = `฿${subtotal}`;
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        function updateQty(index, change) {
            cart[index].quantity += change;
            if(cart[index].quantity <= 0) cart.splice(index, 1);
            saveUserCart(cart);
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveUserCart(cart);
            renderCart();
        }

        function checkout() {
    // 1. ตรวจสอบการเข้าสู่ระบบ
    const user = typeof getCurrentUser === 'function' ? getCurrentUser() : null;
    if (!user) {
        alert('กรุณาเข้าสู่ระบบก่อนทำการสั่งซื้อ');
        window.location.href = 'login.html';
        return;
    }
    
    // 2. ตรวจสอบสินค้าในตะกร้า
    if (!cart || cart.length === 0) {
        alert('กรุณาเลือกสินค้าในตะกร้าก่อนทำการสั่งซื้อ');
        return;
    }

    // 3. ค้นหาช่องอัปโหลดไฟล์สลิปในหน้าเว็บ
    const fileInput = document.querySelector('input[type="file"]');

    // ฟังก์ชันบันทึกข้อมูลออเดอร์ลง localStorage
    const processSave = (slipBase64) => {
        const orders = JSON.parse(localStorage.getItem('orders_ebookgenz')) || [];
        
        orders.push({
            orderId: Date.now(),
            userId: user.id || 'guest',
            userName: user.fullName || 'ทั่วไป',
            items: cart,
            total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
            method: document.getElementById('payment-method') ? document.getElementById('payment-method').value : 'QR Code',
            status: 'pending',
            date: new Date().toLocaleString(),
            slipImage: slipBase64 // บันทึกรูปสลิปจริงของผู้ใช้
        });

        localStorage.setItem('orders_ebookgenz', JSON.stringify(orders));
        
        // เคลียร์ตะกร้าสินค้า
        if (typeof saveUserCart === 'function') {
            saveUserCart([]);
        } else {
            localStorage.removeItem('cart');
        }

        alert('สั่งซื้อสำเร็จ! รอผู้ดูแลระบบตรวจสอบสลิป');
        window.location.href = 'downloads.html';
    };

    // 4. ถ้ามีการแนบไฟล์สลิป ให้แปลงไฟล์เป็นรูปภาพก่อนบันทึก
    if (fileInput && fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            processSave(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        processSave("");
    }
}

        // 🔄 ควบคุมการแสดง QR Code และบัญชีธนาคาร (วางไว้นอกฟังก์ชันใดๆ)
const paymentSelect = document.getElementById('payment-method');
const qrSection = document.getElementById('qr-code-section');
const bankSection = document.getElementById('bank-section');

if (paymentSelect) {
    paymentSelect.addEventListener('change', function() {
        // ซ่อนกล่องทั้งหมดก่อน
        if (qrSection) qrSection.classList.add('hidden');
        if (bankSection) bankSection.classList.add('hidden');

        // แสดงกล่องตามวิธีที่เลือก
        if (this.value === 'PromptPay' && qrSection) {
            qrSection.classList.remove('hidden');
        } else if (this.value === 'Bank Transfer' && bankSection) {
            bankSection.classList.remove('hidden');
        }
    });
}


        

        renderCart();
        updateNavbarAuth();
    </script>
</body>
</html>
